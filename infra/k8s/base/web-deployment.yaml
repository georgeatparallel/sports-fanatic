apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: sports-fanatic
  labels:
    app: web
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: sports-fanatic
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: sports-fanatic
    spec:
      serviceAccountName: web
      containers:
        - name: web
          image: 852421754386.dkr.ecr.us-east-1.amazonaws.com/sports-fanatic-prod/web:latest
          ports:
            - containerPort: 4000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: sports-fanatic-config
            - secretRef:
                name: sports-fanatic-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
      restartPolicy: Always
