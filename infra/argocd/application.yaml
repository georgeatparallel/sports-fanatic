apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sports-fanatic
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/joestein/sports-fanatic.git
    targetRevision: main
    path: infra/k8s/overlays/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: sports-fanatic

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m0s
