apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-bridge
  namespace: sports-fanatic
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: python-bridge
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
