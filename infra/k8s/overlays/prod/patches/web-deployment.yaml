apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: sports-fanatic
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: web
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
