apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sports-fanatic-secrets
  namespace: sports-fanatic
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: sports-fanatic-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: sports-fanatic-prod/app-secrets
        property: DATABASE_URL
    - secretKey: SECRET_KEY_BASE
      remoteRef:
        key: sports-fanatic-prod/app-secrets
        property: SECRET_KEY_BASE
    - secretKey: FANTASY_NERDS_API_KEY
      remoteRef:
        key: sports-fanatic-prod/app-secrets
        property: FANTASY_NERDS_API_KEY
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: sports-fanatic-prod/app-secrets
        property: ANTHROPIC_API_KEY
    - secretKey: EXA_API_KEY
      remoteRef:
        key: sports-fanatic-prod/app-secrets
        property: EXA_API_KEY
    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        key: sports-fanatic-prod/app-secrets
        property: STRIPE_SECRET_KEY
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef:
        key: sports-fanatic-prod/app-secrets
        property: STRIPE_WEBHOOK_SECRET
    - secretKey: STRIPE_PRICE_MONTHLY
      remoteRef:
        key: sports-fanatic-prod/app-secrets
        property: STRIPE_PRICE_MONTHLY
    - secretKey: STRIPE_PRICE_YEARLY
      remoteRef:
        key: sports-fanatic-prod/app-secrets
        property: STRIPE_PRICE_YEARLY
