name: CI

on:
  push:
    branches:
      - main
      - "on-loop/**"
  pull_request:
    branches:
      - main

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.16"
  OTP_VERSION: "26"
  PYTHON_VERSION: "3.11"

jobs:
  # ── Elixir: format + compile + lint ──────────────────────────────────────
  elixir-quality:
    name: Elixir Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore deps cache
        uses: actions/cache@v4
        id: deps-cache
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Restore _build cache
        uses: actions/cache@v4
        with:
          path: _build
          key: ${{ runner.os }}-build-${{ env.MIX_ENV }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-build-${{ env.MIX_ENV }}-

      - name: Install deps
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --force --warnings-as-errors

      - name: Run Credo
        run: mix credo --strict

  # ── Elixir: tests ────────────────────────────────────────────────────────
  elixir-test:
    name: Elixir Tests
    runs-on: ubuntu-latest
    needs: elixir-quality

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sports_fanatic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: ecto://postgres:postgres@localhost:5432/sports_fanatic_test
      VALKEY_URL: redis://localhost:6379
      # Python bridge is not running in CI; circuit breaker / health check will
      # start in :open state. Tests that require the bridge are skipped via tags.
      PYTHON_BRIDGE_URL: http://localhost:8000
      # Disable S3 uploads in CI — no AWS credentials available
      NEWS_S3_ENABLED: "false"
      SECRET_KEY_BASE: "ci_test_secret_key_base_must_be_at_least_64_bytes_long_for_phoenix_to_accept_it"
      PHX_HOST: localhost

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore deps cache
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Restore _build cache
        uses: actions/cache@v4
        with:
          path: _build
          key: ${{ runner.os }}-build-${{ env.MIX_ENV }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-build-${{ env.MIX_ENV }}-

      - name: Install deps
        run: mix deps.get

      - name: Run tests
        run: mix test --exclude python_bridge_required

  # ── Elixir: dependency security audit ────────────────────────────────────
  elixir-security:
    name: Elixir Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore deps cache
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install deps
        run: mix deps.get

      - name: Audit dependencies for known CVEs
        run: mix deps.audit

  # ── Python bridge: lint + test ────────────────────────────────────────────
  python-bridge:
    name: Python Bridge
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: python_bridge

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('python_bridge/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install dev tools
        run: pip install ruff pytest pytest-asyncio httpx

      - name: Lint with Ruff
        run: ruff check src/

      - name: Format check with Ruff
        run: ruff format --check src/

      - name: Run Python tests
        run: |
          if [ -d "tests" ]; then
            pytest tests/ -v
          else
            echo "No Python test directory found, skipping."
          fi
        env:
          ANTHROPIC_API_KEY: "ci-placeholder"
          EXA_API_KEY: "ci-placeholder"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/sports_fanatic_test"
