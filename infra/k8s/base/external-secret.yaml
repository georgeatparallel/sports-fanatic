apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sports-fanatic-secrets
  namespace: sports-fanatic
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: sports-fanatic-secrets
    # Merge leaves non-managed keys in the target Secret intact. The Secret
    # also holds non-sensitive config that's set out-of-band (DATABASE_SSL,
    # PHX_HOST, VALKEY_URL, PYTHON_BRIDGE_URL, NEWS_S3_BUCKET, NEWS_S3_ENABLED)
    # — those should live in a ConfigMap long-term, but until they're moved
    # creationPolicy MUST be Merge or ESO will strip them and the web pods
    # will crash on boot (no DATABASE_SSL → Postgres rejects no-TLS connect).
    creationPolicy: Merge
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: sports-fanatic-prod/app-secrets
        property: DATABASE_URL
    - secretKey: SECRET_KEY_BASE
      remoteRef:
        key: sports-fanatic-prod/app-secrets
        property: SECRET_KEY_BASE
    - secretKey: FANTASY_NERDS_API_KEY
      remoteRef:
        key: sports-fanatic-prod/app-secrets
        property: FANTASY_NERDS_API_KEY
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: sports-fanatic-prod/app-secrets
        property: ANTHROPIC_API_KEY
    - secretKey: EXA_API_KEY
      remoteRef:
        key: sports-fanatic-prod/app-secrets
        property: EXA_API_KEY
    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        key: sports-fanatic-prod/app-secrets
        property: STRIPE_SECRET_KEY
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef:
        key: sports-fanatic-prod/app-secrets
        property: STRIPE_WEBHOOK_SECRET
    - secretKey: STRIPE_PRICE_MONTHLY
      remoteRef:
        key: sports-fanatic-prod/app-secrets
        property: STRIPE_PRICE_MONTHLY
    - secretKey: STRIPE_PRICE_YEARLY
      remoteRef:
        key: sports-fanatic-prod/app-secrets
        property: STRIPE_PRICE_YEARLY
    - secretKey: JOSHUA_USERNAME
      remoteRef:
        key: sports-fanatic-prod/app-secrets
        property: JOSHUA_USERNAME
    - secretKey: JOSHUA_PASSWORD
      remoteRef:
        key: sports-fanatic-prod/app-secrets
        property: JOSHUA_PASSWORD
    - secretKey: OPENMETEO_API_KEY
      remoteRef:
        key: sports-fanatic-prod/app-secrets
        property: OPENMETEO_API_KEY
