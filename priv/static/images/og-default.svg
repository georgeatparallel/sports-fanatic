<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="60%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Brand gradient background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Decorative baseball glyph as low-opacity watermark -->
  <g transform="translate(900,330)" opacity="0.10">
    <circle cx="0" cy="0" r="220" fill="#ffffff"/>
    <!-- Baseball stitches: two C-curves -->
    <path d="M -180 -90 Q 0 -140 180 -90" fill="none" stroke="#dc2626" stroke-width="6" stroke-linecap="round"/>
    <path d="M -180 90 Q 0 140 180 90" fill="none" stroke="#dc2626" stroke-width="6" stroke-linecap="round"/>
    <!-- Stitch ticks (top curve) -->
    <g stroke="#dc2626" stroke-width="3" stroke-linecap="round">
      <line x1="-150" y1="-100" x2="-150" y2="-78"/>
      <line x1="-100" y1="-118" x2="-100" y2="-94"/>
      <line x1="-50" y1="-130" x2="-50" y2="-104"/>
      <line x1="0" y1="-134" x2="0" y2="-108"/>
      <line x1="50" y1="-130" x2="50" y2="-104"/>
      <line x1="100" y1="-118" x2="100" y2="-94"/>
      <line x1="150" y1="-100" x2="150" y2="-78"/>
    </g>
    <!-- Stitch ticks (bottom curve) -->
    <g stroke="#dc2626" stroke-width="3" stroke-linecap="round">
      <line x1="-150" y1="78" x2="-150" y2="100"/>
      <line x1="-100" y1="94" x2="-100" y2="118"/>
      <line x1="-50" y1="104" x2="-50" y2="130"/>
      <line x1="0" y1="108" x2="0" y2="134"/>
      <line x1="50" y1="104" x2="50" y2="130"/>
      <line x1="100" y1="94" x2="100" y2="118"/>
      <line x1="150" y1="78" x2="150" y2="100"/>
    </g>
  </g>

  <!-- Brand name -->
  <text x="80" y="280" font-size="92" font-weight="800"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        fill="#ffffff" letter-spacing="-2">Sports Fan Agent</text>

  <!-- Tagline -->
  <text x="80" y="340" font-size="38" font-weight="500"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        fill="#bfdbfe">AI-Powered MLB Intelligence</text>

  <!-- Accent line -->
  <line x1="80" y1="378" x2="320" y2="378" stroke="#60a5fa" stroke-width="6" stroke-linecap="round"/>

  <!-- Feature strip -->
  <text x="80" y="548" font-size="26" font-weight="500"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        fill="#dbeafe" letter-spacing="0.5">Scouting · Predictions · Game Day · News · Chat</text>

  <!-- Sub-tagline / domain hint -->
  <text x="80" y="588" font-size="20" font-weight="400"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        fill="#93c5fd" opacity="0.9">sports-fan-agent.com</text>
</svg>
