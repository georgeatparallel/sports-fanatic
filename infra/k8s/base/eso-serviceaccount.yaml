apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets
  namespace: sports-fanatic
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/part-of: sports-fanatic
  annotations:
    # IRSA: IAM role for Secrets Manager access — update ARN after terraform apply
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/sports-fanatic-prod-eso-role"
